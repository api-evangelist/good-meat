aid: good-meat
name: GOOD Meat
description: >-
  GOOD Meat is the cultivated-meat division of Eat Just, Inc., a San Francisco food
  technology company. It grows real chicken from animal cells in production
  bioreactors rather than by raising and slaughtering birds, and it was the first
  company in the world cleared to sell cultivated meat to consumers — approved in
  Singapore in December 2020, then cleared by the U.S. FDA in March 2023 and granted
  USDA label approval and grant of inspection in June 2023. Its products have been
  served at 1880 and Huber's Butchery in Singapore and at José Andrés' China Chilcano
  in Washington, D.C., and in May 2024 it became the first cultivated meat sold at
  retail. GOOD Meat is a consumer packaged-food and foodservice brand: it sells meat,
  not software. It operates no developer program, publishes no API, SDK, webhook or
  machine-readable specification, and its parent's GitHub organization carries no
  public repositories.
